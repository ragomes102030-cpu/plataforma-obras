<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: libera as areas do notch e da barra inferior do iPhone,
      para que env(safe-area-inset-*) deixe de ser 0 e a moldura possa se proteger.
      Sem maximum-scale: bloquear o zoom impedia ampliar a planilha no canteiro.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6f8b" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plataforma Obras" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icone-180.png" />
    <meta name="google" content="notranslate" />
    <title>Plataforma Obras - Planejamento integrado</title>
    <script>
      try {
        localStorage.removeItem("theme");
        document.documentElement.removeAttribute("data-theme");
        document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (endpoint.indexOf("%") !== -1 || websiteId.indexOf("%") !== -1) return;
        if (!endpoint || !websiteId) return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = endpoint.replace(/\/$/, "") + "/umami";
        s.setAttribute("data-website-id", websiteId);
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
