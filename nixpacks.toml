# O DockHosting constroi com Nixpacks, nao com o Dockerfile (ver
# docs/DEPLOY-DOCKHOSTING.md). Sem este arquivo o Nixpacks escolhe Node 18 e o
# build morre no Vite 7 ("Vite requires Node.js 20.19+ or 22.12+") e, logo
# depois, no binario nativo do @tailwindcss/oxide ("Cannot find native binding").
#
# Tres regras para nao quebrar o build de novo:
#
#  1. So usar campos do schema do Nixpacks que existem: nixPkgs, aptPkgs, cmds e
#     [start] cmd. Nada de "paths"/"cacheDirectories" — se o schema nao conhecer
#     o campo, o Nixpacks recusa o arquivo e o build nem comeca.
#  2. So usar nomes de pacote na forma canonica do nixpkgs (`nodejs_22`). O alias
#     antigo com hifen (`pnpm-10_x`) nao existe no nixpkgs: `nix-env -iA` falha
#     com "attribute not found" e o build morre no setup. O nixpkgs expoe
#     `pnpm_10`, mas a versao vem do `packageManager` do package.json, nao do nix
#     (ver item 3), entao aqui nem aparece.
#  3. Nao depender do corepack para o pnpm: instalamos pelo npm na versao exata
#     do `packageManager`. `corepack enable` renovava a assinatura do shim a
#     cada release e era mais um ponto de falha na rede.
#
# O `engines.node: 22.x` do package.json tambem pede Node 22; aqui fica fixo para
# nao depender da deteccao do plano.

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]
aptPkgs = ["curl"]

[phases.install]
cmds = [
  "node scripts/check-node.mjs",
  "npm install -g pnpm@10.4.1",
  "pnpm install --frozen-lockfile --prod=false",
]

[phases.build]
cmds = ["pnpm run build"]

# O padrao do Nixpacks para projetos Node com Vite e subir um Caddy servindo
# estatico. Este e um servidor Express: o start precisa ser o `start` do
# package.json, que roda migrate && audit && node dist/index.js.
[start]
cmd = "npm start"
