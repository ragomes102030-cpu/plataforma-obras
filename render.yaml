services:
  - type: web
    name: plataforma-obras-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # Migration por ARQUIVO, e nao por estado do schema.
    #
    # Antes era `pnpm exec drizzle-kit push`. O `push` compara o schema do codigo
    # com o banco e altera o que achar diferente, direto, sem registrar qual
    # migration rodou. O resultado e um banco que tem as tabelas e nao tem
    # `__drizzle_migrations` — um estado que nenhum relatorio consegue explicar.
    #
    # `migrate-pg.mjs` trata esse estado: ele classifica como banco legado e
    # marca as migrations como aplicadas SEM reexecutar o DDL, entao trocar o
    # `push` por ele nao duplica tabela nem reapplica migration em cima de banco
    # ja montado.
    #
    # Os `;` sao deliberados, e nao `&&`: cada passo roda mesmo que o anterior
    # tenha falhado, e a falha de um nao impede o `pnpm start`. A aplicacao
    # precisa subir para responder `/readyz` e dizer o que esta errado. Com
    # `&&`, um erro de migration impediria o boot e o servico ficaria em
    # crash-loop sem nunca reportar a causa.
    startCommand: node scripts/migrate-pg.mjs; node scripts/audit-schema-pg.mjs; pnpm start
    autoDeploy: true
    # `/healthz` e proposital: ele devolve 200 sem tocar o banco. `/readyz` faz
    # `SELECT 1` e conta tabelas, e um servico que demora para acordar seria
    # marcado como morto pelo proprio health check.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        value: https://plataforma-obras-8uhqy3k5f-rafael-5864.vercel.app
      - key: AI_API_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5-mini
      - key: LLM_PRIMARY_PROVIDER
        sync: false
      - key: LLM_PRIMARY_BASE_URL
        sync: false
      - key: LLM_PRIMARY_API_KEY
        sync: false
      - key: LLM_PRIMARY_MODEL
        sync: false
      - key: LLM_FALLBACK_PROVIDER
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false
      - key: LLM_SECONDARY_PROVIDER
        sync: false
      - key: LLM_SECONDARY_BASE_URL
        sync: false
      - key: LLM_SECONDARY_API_KEY
        sync: false
      - key: LLM_SECONDARY_MODEL
        sync: false
      - key: LLM_MAX_ATTEMPTS
        value: "3"
      - key: LLM_REQUEST_TIMEOUT_MS
        value: "45000"
      - key: MCP_EAP_URL
        sync: false
      - key: MCP_CRONOGRAMA_URL
        sync: false
      - key: MCP_GANTT_LOB_URL
        sync: false
      - key: MCP_REQUEST_TIMEOUT_MS
        value: "60000"
