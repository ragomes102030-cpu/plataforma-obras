services:
  - type: web
    name: plataforma-obras-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm db:push && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        value: https://plataforma-obras-api.onrender.com
      - key: AI_API_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5-mini
      - key: LLM_PRIMARY_PROVIDER
        sync: false
      - key: LLM_PRIMARY_BASE_URL
        sync: false
      - key: LLM_PRIMARY_API_KEY
        sync: false
      - key: LLM_PRIMARY_MODEL
        sync: false
      - key: LLM_FALLBACK_PROVIDER
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false
      - key: LLM_SECONDARY_PROVIDER
        sync: false
      - key: LLM_SECONDARY_BASE_URL
        sync: false
      - key: LLM_SECONDARY_API_KEY
        sync: false
      - key: LLM_SECONDARY_MODEL
        sync: false
      - key: LLM_MAX_ATTEMPTS
        value: "3"
      - key: LLM_REQUEST_TIMEOUT_MS
        value: "45000"
      - key: MCP_EAP_URL
        sync: false
      - key: MCP_CRONOGRAMA_URL
        sync: false
      - key: MCP_GANTT_LOB_URL
        sync: false
