name: Aurora EAP Regression

on:
  # `main` é o branch de verdade desde #117; `develop` é só um espelho atualizado
  # pelo sync-develop com GITHUB_TOKEN, e push feito por token não dispara
  # workflow. Sem `main` aqui, esta regressão deixava de rodar sozinha.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aurora-eap:
    runs-on: ubuntu-latest
    env:
      AURORA_PROJECT_ID: 7
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      # CA do próprio projeto Supabase; mantém autenticação do servidor TLS.
      # Configure SUPABASE_DB_CA_PEM em Settings → Secrets and variables → Actions.
      SUPABASE_DB_CA_PEM: ${{ secrets.SUPABASE_DB_CA_PEM }}
      # Snapshot opcional (ex. 69:53:15), nunca obrigatório para edição manual.
      AURORA_EAP_SNAPSHOT: ${{ vars.AURORA_EAP_SNAPSHOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exigir o segredo do banco
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::DATABASE_URL ausente. Esta regressão consulta o banco real da Aurora; sem o segredo ela não pode passar em silêncio."
          exit 1

      - name: Run Aurora EAP regression
        run: pnpm test:regression:aurora-eap
