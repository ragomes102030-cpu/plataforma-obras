name: Deploy to DockHosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: |
          pnpm check
          pnpm test --run

      - name: Build
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKHOSTING_DOCKER_USER }}
          password: ${{ secrets.DOCKHOSTING_DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKHOSTING_DOCKER_USER }}/plataforma-obras
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKHOSTING_DOCKER_USER }}/plataforma-obras:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKHOSTING_DOCKER_USER }}/plataforma-obras:buildcache,mode=max
          platforms: linux/amd64

      - name: Trigger DockHosting redeployment
        run: |
          # DockHosting faz pull automaticamente da tag latest
          # O deploy acontece automaticamente quando a imagem eh atualizada
          echo "Docker image pushed to registry"
          echo "DockHosting will pull the new image automatically"
          echo "Image: ${{ secrets.DOCKHOSTING_DOCKER_USER }}/plataforma-obras:${{ steps.meta.outputs.version }}"
          echo "Configure seu container no painel do DockHosting para fazer pull desta imagem"
