name: Deploy to DockHosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: |
          pnpm check
          pnpm test --run

      - name: Build
        run: pnpm build

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ragomes102030-cpu/plataforma-obras
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=github-actions
          cache-to: type=github-actions,mode=max

      - name: Trigger DockHosting deploy
        run: |
          curl -X POST "${{ secrets.DOCKHOSTING_DEPLOY_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DOCKHOSTING_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "ghcr.io/ragomes102030-cpu/plataforma-obras:${{ steps.meta.outputs.version }}",
              "port": 3000,
              "env": {
                "NODE_ENV": "production",
                "PORT": "3000",
                "DATABASE_URL": "'"${{ secrets.DOCKHOSTING_DATABASE_URL }}"'",
                "PUBLIC_APP_URL": "'"${{ secrets.DOCKHOSTING_PUBLIC_APP_URL }}"'",
                "JWT_SECRET": "'"${{ secrets.DOCKHOSTING_JWT_SECRET }}"'",
                "USE_SUPABASE": "1",
                "SUPABASE_DB_URL": "'"${{ secrets.DOCKHOSTING_SUPABASE_DB_URL }}"'"
              }
            }'
