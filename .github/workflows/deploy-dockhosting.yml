name: CI - Validação para DockHosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm test --run

      - name: Build
        run: pnpm build

      - name: Docker build (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: plataforma-obras:latest
          load: true
          platforms: linux/amd64

      - name: Deploy via DockHosting
        run: |
          echo "Build validado com sucesso!"
          echo "O DockHosting fara o deploy automaticamente ao detectar o push na branch main"
          echo "Configure as variaveis de ambiente no painel do DockHosting"
