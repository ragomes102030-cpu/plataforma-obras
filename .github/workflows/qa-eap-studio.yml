name: EAP Studio QA (isolado)
on:
  push:
    branches: [qa/eap-studio-visual]
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Avaliar EAP desktop/celular, sem banco
        run: pnpm exec playwright test -c playwright.eap-studio.config.ts
      - name: Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eap-studio-visual-evidencias
          path: test-results/eap-studio/
          if-no-files-found: ignore
