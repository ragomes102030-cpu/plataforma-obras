name: Deploy verify (Render)

# ============================================================================
# UM ALVO, UM URL, UM LUGAR PARA OLHAR.
#
# Este workflow existe para responder UMA pergunta depois de cada push na
# `main`: o endereco publico esta servindo o commit que acabou de ser mergeado?
# Se a resposta for "nao", ele falha. Sim, ele falha de proposito — um deploy
# silenciosamente velho e pior do que um deploy vermelho, porque o dono segue
# usando o sistema achando que a correcao entrou.
#
# HISTORICO (para nao repetir o erro)
#
# 1. Railway: o host do health-check apontava para um servico que nao existia
#    mais. O job ficava 45 min em TIMEOUT, parecendo "deploy lento".
# 2. DockHosting (`plataforma-obras.dockhosting.dev`): virou o alvo, depois
#    deixou de receber deploy e continuou no ar servindo um commit antigo —
#    dois "producao" para o mesmo banco Supabase. Este workflow vigiava esse
#    host e por isso falhava em todo push.
# 3. Hoje o alvo e o Render, servico `plataforma-obras-3`.
#
# O QUE ELE FAZ
#
#   1. pergunta ao Render se ja existe deploy para este SHA;
#   2. se nao existe, dispara um (o auto-deploy do Render nem sempre acorda);
#   3. vigia `/healthz` ate o `commit` publicado bater com o SHA do push.
#
# SECRETS / VARS
#
#   secrets.RENDER_API_KEY    obrigatorio para disparar o deploy. Sem ele, o
#                             job so vigia (e avisa no log).
#   vars.RENDER_SERVICE_ID    opcional; o padrao esta abaixo.
#
# ============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "SHA a confirmar (vazio = HEAD)"
        required: false
        type: string

# Dois pushes seguidos nao precisam de dois vigias: o mais novo e o que importa.
concurrency:
  group: deploy-verify
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  confirmar:
    name: Confirmar o SHA em producao
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Disparar o deploy no Render (se ainda nao houver um para este commit)
        if: github.event_name == 'push'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_SERVICE_ID || 'srv-dbcd0gon74is7384ufag' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::warning::RENDER_API_KEY nao configurado. Vou apenas vigiar o /healthz."
            echo "::warning::Se o auto-deploy do Render nao disparar, este job falha mostrando o SHA antigo — e ai a acao e disparar o deploy pela API."
            exit 0
          fi

          api="https://api.render.com/v1/services/${SERVICE_ID}"
          hdr="Authorization: Bearer ${RENDER_API_KEY}"

          echo "Servico: ${SERVICE_ID}"
          echo "Commit:  ${SHA}"

          # O Render pagina; limit=10 cobre "ultimo deploy + os concorrentes".
          deploys="$(curl -sS -H "${hdr}" "${api}/deploys?limit=10")"

          if ! echo "${deploys}" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::warning::Resposta inesperada do Render ao listar deploys:"
            echo "${deploys}"
            exit 0
          fi

          # Ja existe deploy deste commit? Qual o status?
          status="$(echo "${deploys}" \
            | jq -r --arg sha "${SHA}" '
                [ .[] | select((.commit.id // "") | startswith($sha[0:7])) ]
                | sort_by(.createdAt) | last | .status // ""')"

          echo "Deploy deste commit no Render: ${status:-(nenhum)}"

          case "${status}" in
            live)
              echo "Ja esta no ar. Nada a disparar."
              exit 0
              ;;
            created|build_in_progress|update_in_progress|pre_deploy_in_progress)
              echo "Deploy em andamento. Vou so vigiar."
              exit 0
              ;;
          esac

          echo "Disparando deploy para ${SHA}..."
          resp="$(curl -sS -X POST -H "${hdr}" -H 'content-type: application/json' \
            -d "{\"commitId\": \"${SHA}\"}" "${api}/deploys")"
          echo "${resp}" | jq -c '{deployId: .id, status: .status, commit: .commit.id}' 2>/dev/null || echo "${resp}"

      - name: Confirmar o SHA em producao
        env:
          SHA: ${{ github.event.inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          export PLATAFORMA_HEALTHZ="https://plataforma-obras-3.onrender.com/healthz"
          # 80 tentativas x 20s = ~27 min. O Render free hiberna; o primeiro
          # request pode levar ~60s so para acordar, por isso 20s e nao 5s.
          node scripts/verificar-deploy.mjs "${SHA}" 80 20000

      - name: Registrar o estado final
        if: always()
        run: |
          echo "=== /healthz ==="
          curl -sS --max-time 20 "https://plataforma-obras-3.onrender.com/healthz" || true
          echo
          echo "=== /readyz ==="
          curl -sS --max-time 20 "https://plataforma-obras-3.onrender.com/readyz" || true
