name: Migração pontual SICRO
on:
  push:
    branches: [fix/sicro-catalog]
jobs:
  migrar:
    if: github.event.head_commit.message == 'Aplicar migração SICRO autorizada'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
      SUPABASE_DB_CA_PEM: ${{ secrets.SUPABASE_DB_CA_PEM }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/aplicar-sicro-temporario.mjs

