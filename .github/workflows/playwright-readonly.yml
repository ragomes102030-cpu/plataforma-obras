name: Playwright Read-Only QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - qa/playwright-*

jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Public + authenticated read-only smoke
        env:
          PLAYWRIGHT_BASE_URL: https://plataforma-obras-api.onrender.com
          PLAYWRIGHT_STORAGE_STATE: .playwright/auth.json
          AUTH_STATE_B64: ${{ secrets.ARQUIMEDES_PLAYWRIGHT_AUTH_B64 }}
        run: |
          if [ -n "$AUTH_STATE_B64" ]; then
            mkdir -p .playwright
            printf '%s' "$AUTH_STATE_B64" | base64 --decode > .playwright/auth.json
          else
            echo "No ARQUIMEDES_PLAYWRIGHT_AUTH_B64 configured; authenticated Aurora portion will be skipped."
          fi
          pnpm e2e:playwright
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-readonly-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
