name: QA CPM Regression (isolated)

on:
  push:
    branches:
      - qa/fix-cpm-persister-test-2026-10-14

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Run unit tests
        run: pnpm test --run
      - name: Build production bundle (no deploy)
        run: pnpm build
