name: CI

# UM SO BRANCO DE TRABALHO: `main`.
#
# Antes, este workflow rodava tambem em `develop` e em
# `production-stable-20261005`. Como o `sync-develop.yml` empurra cada commit de
# `main` para `develop`, todo merge gerava DUAS execucoes completas do CI
# (~15 min cada) para o mesmo SHA, e o `deploy-dockhosting.yml` gerava uma
# terceira. Resultado pratico: tres filas verdes para uma mudanca e fila de
# espera no runner gratuito.
#
# `develop` continua existindo como espelho automatico de `main`
# (docs/SINCRONIZACAO-MAIN-DEVELOP.md), mas nao e branch de trabalho e nao
# precisa de CI proprio: o commit dele e o mesmo de `main`, ja validado.
# `production-stable-20261005` e ancora de rollback, congelada: nao recebe push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Visibilidade, não bloqueio. Um advisory publicado hoje não pode travar o
      # deploy da correção de amanhã, mas também não pode passar em silêncio: o
      # passo imprime o relatório e emite ::warning:: quando há high/critical em
      # dependência de PRODUÇÃO (dev fica de fora — não entra na imagem).
      # Contexto e overrides: docs/DECISIONS.md, Decisão 19.
      - name: Auditoria de dependências de produção
        continue-on-error: true
        run: |
          if pnpm audit --prod --audit-level=high; then
            echo "Sem vulnerabilidade high/critical em dependência de produção."
          else
            echo "::warning::pnpm audit --prod encontrou vulnerabilidade high/critical em dependência de produção — ver docs/DECISIONS.md (Decisão 19)."
          fi
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test --run
      - name: Build
        run: pnpm build

  # Guarda de build: reproduz a fase de install do Nixpacks/Coolify com o ambiente
  # hostil que derrubou o deploy do #133 — NODE_ENV=production e
  # NPM_CONFIG_PRODUCTION=true como build-arg. Nesse modo o `npm install -g` grava
  # o binario num prefixo que nao esta no PATH, e o passo seguinte morre com
  # "pnpm: command not found" (exit 127). Com NODE_ENV=production o pnpm tambem
  # omite devDependencies, e vite/esbuild vivem la.
  #
  # Este job NAO repete os comandos de memoria: ele le o nixpacks.toml e executa
  # exatamente os cmds de install e build que estao la. Se alguem voltar a
  # escrever `npm install -g pnpm` sem prefixo explicito e sem PATH inline, fica
  # vermelho aqui em ~4 min, em vez de vermelho no painel depois de 15.
  build-guard:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NPM_CONFIG_PRODUCTION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Preparar o prefixo global
        run: sudo mkdir -p /opt/pnpm && sudo chown "$USER" /opt/pnpm
      - name: Executar as fases do nixpacks.toml
        run: |
          set -euo pipefail
          python3 -c "import tomllib; p=tomllib.load(open('nixpacks.toml','rb')); [print(c) for ph in ('install','build') for c in p['phases'][ph].get('cmds',[])]" > /tmp/nixpacks-cmds.txt
          while IFS= read -r cmd; do
            echo "::group::nixpacks -> $cmd"
            bash -c "$cmd"
            echo "::endgroup::"
          done < /tmp/nixpacks-cmds.txt
      - name: Exigir os artefatos do build
        run: |
          set -euo pipefail
          test -x node_modules/.bin/vite || { echo "::error::vite ausente: o install rodou como producao ou pulou devDependencies."; exit 1; }
          test -f dist/index.js || { echo "::error::dist/index.js nao foi gerado pelo build."; exit 1; }

  # A auditoria de schema SO le o catalogo do PostgreSQL e compara com o DDL das
  # migrations. Ela roda aqui de proposito: divergencia de schema tem que
  # aparecer no CI, vermelha e legivel, e nao como container que se recusa a
  # subir em producao — ou, pior, como deploy verde com banco fora de sincronia.
  #
  # `USE_SUPABASE=1` porque em producao e esse o caminho de conexao (ver
  # scripts/audit-schema-pg.mjs:40, que troca o host direto pelo pooler).
  # Sem o secret o job FALHA de proposito: auditoria que passa verde sem rodar
  # esconde divergencia de schema (foi exatamente o que aconteceu no workflow
  # da Aurora antes do PR #125).
  schema-audit:
    runs-on: ubuntu-latest
    env:
      USE_SUPABASE: "1"
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_CA_PEM: ${{ secrets.SUPABASE_DB_CA_PEM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Auditar schema contra o Supabase
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm db:audit
      - name: Exigir o segredo do banco
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::DATABASE_URL ausente: a auditoria de schema nao pode ser pulada em silencio."
          exit 1
